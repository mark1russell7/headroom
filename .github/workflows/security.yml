# The security scans of this repository: dependency review, osv-scanner and CodeQL (CI.md of
# mark1russell7/template). A pull request fails only for a new finding at or above high. Pushes to
# main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "38 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@ed0b3ebc9cd89b78c880fb7af9f6b09392a383f7 # main

  # The one check of this file that the ruleset of main names, next to CI OK (CI.md of
  # mark1russell7/template, "The check of the ruleset"). The scans stay out of ci.yml, because
  # release.yml calls ci.yml with contents: read only.
