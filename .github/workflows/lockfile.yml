# Makes pnpm-lock.yaml again on a runner, for the branch that the run starts on. Use it when the local computer
# has no memory for an install (reusable-lockfile.yml of the template tells the steps):
#
#   gh workflow run lockfile.yml -R <owner/repo> --ref <branch>
#
# A dispatch on the default branch fails.
name: Lockfile

on:
  workflow_dispatch:

permissions: {}

# One run for each branch: a new start cancels the older one
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    uses: mark1russell7/template/.github/workflows/reusable-lockfile.yml@5d70553c6998c5f6f0fed13dc4528f6a207f2f4a # main
    permissions:
      contents: read
